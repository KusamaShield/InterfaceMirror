<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Privacy Chart Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #0f0f0f; color: white; font-family: monospace; }
        .test-button { background: linear-gradient(135deg, #9333ea, #e91e63); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
        .test-button:hover { opacity: 0.9; }
        .log { background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 10px 0; max-height: 300px; overflow-y: auto; }
        .log-item { padding: 5px; border-bottom: 1px solid #333; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
    <h1>Privacy Chart Asset Scanning Test</h1>
    <p>Testing Paseo v3 shield pool asset discovery via WebSocket</p>
    
    <button class="test-button" onclick="testAssetScanning()">
        🚀 Test Asset Scanning
    </button>
    
    <div class="log" id="log"></div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(item);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testAssetScanning() {
            log('Starting asset scanning test...', 'info');
            
            try {
                // Test WebSocket connection
                log('🔗 Testing WebSocket connection to wss://asset-hub-paseo-rpc.n.dwellir.com...', 'info');
                
                // Create a simple WebSocket health check
                const wsTest = new WebSocket('wss://asset-hub-paseo-rpc.n.dwellir.com');
                
                wsTest.onopen = () => {
                    log('✅ WebSocket connection established', 'success');
                    wsTest.close();
                };
                
                wsTest.onerror = (error) => {
                    log('❌ WebSocket connection failed', 'error');
                    log(`Error details: ${JSON.stringify(error)}`, 'error');
                };
                
                wsTest.onclose = () => {
                    log('🔗 WebSocket connection closed', 'info');
                };

                // Wait a bit for WebSocket test
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Test Buffer polyfill
                log('🧪 Testing Buffer polyfill...', 'info');
                try {
                    if (typeof Buffer !== 'undefined') {
                        const testHex = '5053494c56'; // "PSILV" in hex
                        const decoded = Buffer.from(testHex, 'hex').toString('utf8');
                        log(`✅ Buffer working: "${decoded}" decoded from hex`, 'success');
                    } else {
                        log('⚠️ Buffer not available, trying alternative...', 'error');
                        
                        // Alternative hex decoding
                        const testHex = '5053494c56';
                        let result = '';
                        for (let i = 0; i < testHex.length; i += 2) {
                            result += String.fromCharCode(parseInt(testHex.substr(i, 2), 16));
                        }
                        log(`✅ Alternative decoding: "${result}"`, 'success');
                    }
                } catch (bufferError) {
                    log(`❌ Buffer error: ${bufferError.message}`, 'error');
                }

                // Test fetch to RPC proxy
                log('🌐 Testing RPC proxy connection...', 'info');
                try {
                    const response = await fetch('/api/rpc-proxy', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            id: 1,
                            method: 'web3_clientVersion',
                            params: []
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ RPC proxy working: ${data.result?.slice(0, 50) || 'No version'}`, 'success');
                    } else {
                        log(`❌ RPC proxy error: ${response.status} ${response.statusText}`, 'error');
                    }
                } catch (fetchError) {
                    log(`❌ RPC proxy fetch failed: ${fetchError.message}`, 'error');
                }

                // Test contract existence
                log('📝 Testing shield contract existence...', 'info');
                try {
                    const response = await fetch('/api/rpc-proxy', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            id: 2,
                            method: 'eth_getCode',
                            params: ['0x3099889C1538f0200B831181cbfb532a4e9A418F', 'latest']
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const code = data.result;
                        if (code && code !== '0x' && code !== '0x0' && code !== '0x00') {
                            log(`✅ Contract exists: ${code.slice(0, 20)}...`, 'success');
                        } else {
                            log('❌ Contract code empty or missing', 'error');
                        }
                    }
                } catch (contractError) {
                    log(`❌ Contract check failed: ${contractError.message}`, 'error');
                }

                log('✅ All tests completed!', 'success');
                log('ℹ️ The privacy chart should now show: PAS (130.701) + PSILV (100) + CAP (500)', 'info');

            } catch (error) {
                log(`❌ Test failed: ${error.message}`, 'error');
            }
        }

        log('Page loaded. Click "Test Asset Scanning" button to start.', 'info');
    </script>
</body>
</html>
